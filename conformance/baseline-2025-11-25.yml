#
# Expected failures for the 2025-11-25 requirement set over HTTP: every scored scenario, one
# reason -- design. The HTTP transport serves the 2026-07-28 stateless model only and
# requires mcp-protocol-version on every POST; the suite's stateful client sends `initialize`
# without it and nothing after can run. 2025-11-25 lives on stdio, which the suite cannot
# drive (it has no stdio server mode). This is the design meeting the suite, not a failure,
# and the README says so.
server:
  - server-initialize # design
  - logging-set-level # design
  - ping # design
  - completion-complete # design
  - tools-list # design
  - tools-call-simple-text # design
  - tools-call-image # design
  - tools-call-audio # design
  - tools-call-embedded-resource # design
  - tools-call-mixed-content # design
  - tools-call-with-logging # design
  - tools-call-error # design
  - tools-call-with-progress # design
  - tools-call-sampling # design
  - tools-call-elicitation # design
  - elicitation-sep1034-defaults # design
  - server-sse-multiple-streams # design
  - elicitation-sep1330-enums # design
  - resources-list # design
  - resources-read-text # design
  - resources-read-binary # design
  - resources-templates-read # design
  - resources-subscribe # design
  - resources-unsubscribe # design
  - prompts-list # design
  - prompts-get-simple # design
  - prompts-get-with-args # design
  - prompts-get-embedded-resource # design
  - prompts-get-with-image # design
  - dns-rebinding-protection # design
