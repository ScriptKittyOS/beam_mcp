# Expected failures for the 2026-07-28 requirement set. Every entry carries its reason word:
#   deliberately-out   the package refuses the surface by decision (README, "deliberately out")
#   decided-not-built  decided, no code yet (completion/complete)
#   not-implemented    a content type or behaviour the package does not emit or read
#   harness            the suite needs a diagnostic tool this package cannot honestly serve
