name: gate

on:
  push:
    branches: ["**"]
  pull_request:

# THE MATRIX: the floor pair, the pinned pair, the head pair. The floor leg is what turns
# "beam_mcp supports OTP 27" (the compile-time floor in mix.exs) from a sentence into a
# measurement; until it ran, the floor was a claim about a release nobody here had run. The
# pinned leg is `.tool-versions`' line, and it is the only leg on which the gate's format step
# measures anything -- `mix format` differs between Elixir minors, so the formatter is one
# program and the other legs' format line reads NOT MEASURED by design (tools/gate.sh). The
# head leg is the newest pair the compatibility table lists. Each pair is one the table lists
# as supported (Elixir 1.17 -> OTP 25-27; 1.18 -> 25-27, with 1.18.5 running on 28 as
# CONVENTIONS records; 1.20 -> 27-29). What setup-beam installs for a pair on a given runner
# image is observed, not assumed: the first run's log is the evidence, and the slice record
# quotes it. `fail-fast: false` so one leg's red does not hide another's measurement.
#
# THE REQUIRED CHECK IS THE SUMMARY JOB. The repository's ruleset on main requires the status
# context "Gate - quality gate" by name; a matrix leg's context carries its values, so no leg
# could satisfy it and a pull request would wait on a check that never reports. `summary`
# carries that exact name, runs after every leg (`if: always()`), and fails unless the legs
# all succeeded -- so the ruleset stays as it is and the required check means "all three".
jobs:
  gate:
    name: Gate - leg (OTP ${{ matrix.otp }}, Elixir ${{ matrix.elixir }}, ${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: floor,  otp: "27", elixir: "1.17" }
          - { leg: pinned, otp: "28", elixir: "1.18" }
          - { leg: head,   otp: "29", elixir: "1.20" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: the pair setup-beam installed (observed, quoted in the slice record)
        run: |
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
          elixir --version
          cat .tool-versions
      - run: mix deps.get
      # The leg says what it claims to be, so the gate can hold it to it: on the pinned leg a
      # format step that cannot measure (the running Elixir is not `.tool-versions`' line) is a
      # FAIL, not NOT MEASURED -- otherwise a pin moved in `.tool-versions` and not here would
      # leave every leg unmeasured and the summary green (a review lane's finding).
      # GATE_BENCH=record: on a shared runner the bench's figures are recorded beside the
      # local thresholds, never enforced -- the draw overlaps the ceiling there (tools/gate.sh).
      - run: GATE_LEG=${{ matrix.leg }} GATE_BENCH=record ./tools/gate.sh

  summary:
    name: Gate - quality gate
    runs-on: ubuntu-latest
    needs: gate
    if: always()
    steps:
      - name: every leg of the matrix passed
        run: |
          echo "legs: ${{ needs.gate.result }}"
          [ "${{ needs.gate.result }}" = "success" ]

  dco:
    name: Gate - DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: every commit in the range carries a Signed-off-by
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
            git rev-list --no-merges "$range" > /tmp/commits \
              || { echo "cannot resolve $range"; exit 1; }
          elif [ -z "$before" ] \
            || [ "$before" = "0000000000000000000000000000000000000000" ] \
            || ! git rev-parse --verify --quiet "$before^{commit}" >/dev/null; then
            # Two cases, one fallback. A branch's first push has no previous state, so
            # github.event.before is the all-zeros SHA. A force-push names a real-looking SHA
            # that is no longer reachable -- dropping a commit leaves `before` pointing at
            # something the fetched history does not contain. Testing the SHA's SHAPE catches
            # only the first; asking git whether it RESOLVES catches both.
            echo "before is unusable ('$before'): checking every commit reachable from HEAD"
            git rev-list --no-merges HEAD > /tmp/commits \
              || { echo "cannot list commits from HEAD"; exit 1; }
          else
            range="$before..HEAD"
            git rev-list --no-merges "$range" > /tmp/commits \
              || { echo "cannot resolve $range"; exit 1; }
          fi
          echo "commits in scope: $(wc -l < /tmp/commits)"
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by: '; then
              echo "  ok   $sha"
            else
              echo "  FAIL $sha carries no Signed-off-by"; fail=1
            fi
          done < /tmp/commits
          exit $fail
