#
# The conformance step, CI-ONLY by decision: the local gate (tools/gate.sh, fifteen steps)
# stays dependency-light so a contributor with Elixir and Erlang runs it green without a Node
# toolchain or a Python interpreter, and stays the gate people actually run. This job carries
# the second toolchain the number costs -- Node 22, pinned -- and the runner's python3, runs
# tools/conformance.sh with the suite pinned by exact version, and fails on a regression
# against conformance/baseline-<revision>.yml or a stale entry, by the suite's own exit code.
#
# IT FAILS LOUDLY, NEVER SKIPS: tools/conformance.sh exits 2 by name when node >= 22 or python3
# is absent, and a step that passed because a toolchain was missing would be a green that
# means nothing -- the same defect class as a check count that folds skipped checks into
# passes. The number it publishes is the README's, reproducible locally by anyone with the
# toolchain: `tools/conformance.sh`.

name: conformance

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance - the two rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: mix deps.get
      - run: mix compile
      - name: the suite, both revisions, against the baselines
        run: |
          set -uo pipefail
          node --version
          python3 --version
          OUT="$RUNNER_TEMP/conformance" ./tools/conformance.sh
      # REUSE, by the specification's own tool -- CI-ONLY like the conformance number: the
      # gate's REUSE step reads headers and excludes the slice archives; this reads the whole
      # tree under REUSE.toml and is the compliance claim CONTRIBUTING makes. The runner's
      # pipx installs it; the version is pinned so the verdict is a function of the tree.
      - name: REUSE - the specification's lint over the whole tree
        if: always()
        run: pipx run reuse==6.2.0 lint

      - name: the suite's results, kept with the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance
          if-no-files-found: error
