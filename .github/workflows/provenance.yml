#
# Build provenance for the Hex tarball: on a release tag, CI builds the tarball, attests its
# digest (SLSA build provenance, GitHub's attestation store, Sigstore-signed), and verifies the
# attestation -- against the tarball it just built, and against the bytes hex.pm serves for
# that version, downloaded fresh, so the assertion is about the PUBLISHED tarball and not a
# local copy.
#
# WHY THE DIGEST BINDS TO WHAT hex.pm SHOWS -- AND ONLY IF BOTH SIDES BUILD THE SAME WAY. The
# outer tarball's sha256 IS the "Package checksum" hex.pm records. But `mix hex.build` packages
# the working tree as it lies: on-disk file modes (umask 002 vs 022) and a directory's readdir
# order both change the bytes -- one commit gave a review lane three checksums on one day. So
# the tarball is built by tools/release_tarball.sh, which makes the bytes canonical by
# construction (`git archive` at the ref with tar.umask=022: every file 644, only tracked
# files; globs in mix.exs's `files:` for one entry order), and the publisher builds AND
# publishes with the same script (`--publish`). A release published any other way will not
# match this attestation, and the last step below says so, loudly, on the tag's run.
#
# THE OWNER TAGS AND PUBLISHES; THIS WORKFLOW ATTESTS. It never runs `mix hex.publish`. The
# order is publish, then push the tag: the tag's run downloads the published bytes and
# verifies the attestation against them, and on a tag any failure to fetch or to match is a
# FAILURE -- that run is the one the binding is claimed on. On a manual run
# (workflow_dispatch) the tarball is nobody's release; that run proves the loop, and its
# hex.pm half reads NOT MEASURED -- whether hex.pm serves nothing for the version or serves
# bytes this commit does not build -- which is what it is.
#
# THE SBOM (from 0.10.0). tools/sbom.sh generates a CycloneDX 1.6 SBOM of the runtime
# dependency set from the same tree, outside mix.exs (the EEF's mix_sbom binary, pinned by
# version and digest; one named workaround, G-087), and actions/attest binds it to the
# tarball's digest as a second attestation (predicate https://cyclonedx.org/bom). A consumer
# verifies it with `gh attestation verify <tarball> --predicate-type https://cyclonedx.org/bom`
# and fetches it with `gh attestation download` (docs/provenance.md).
#
# CI is unproven until a run exists (CONVENTIONS): the first workflow_dispatch run is the
# evidence for the attest->verify loop; the first tag after this lands is the evidence for
# the hex.pm binding. Both are quoted in the slice record when they exist.

name: provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    name: Provenance - build, attest, verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.build.outputs.version }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The pinned pair, a copy of .tool-versions' line (setup-beam does not resolve that file's
      # spelling -- CONVENTIONS). Every action is pinned by commit with its version beside it
      # (test/beam_mcp/governance_test.exs holds that for every workflow); the attestation
      # action was the first, because it is the one whose behaviour the attestation's meaning
      # depends on.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.18"
      - name: the tarball, built the canonical way, its version and its sha256 (hex.pm's package checksum)
        id: build
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^  @version "([^"]+)"$/\1/p' mix.exs | head -1)
          [ -n "$version" ] || { echo "no @version in mix.exs"; exit 1; }
          tools/release_tarball.sh "${GITHUB_SHA}" "beam_mcp-${version}.tar" | tee build.out
          sha=$(sha256sum "beam_mcp-${version}.tar" | cut -d' ' -f1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "tarball beam_mcp-${version}.tar sha256 ${sha}"
      # Pinned by commit (v4.2.2, 2026-08-06): the attestation's subject is the tarball's
      # sha256; the predicate is SLSA build provenance naming this repository, commit and
      # workflow; the signature is Sigstore's, the record GitHub's attestation store.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: beam_mcp-${{ steps.build.outputs.version }}.tar
      - name: the SBOM, generated outside mix.exs from the same tree (tools/sbom.sh)
        run: tools/sbom.sh "${GITHUB_SHA}" "beam_mcp-${{ steps.build.outputs.version }}.cdx.json"
      # Pinned by commit (v4.2.2, 2026-08-04): the SBOM attestation's subject is the same
      # tarball digest; the predicate is the CycloneDX document itself.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: beam_mcp-${{ steps.build.outputs.version }}.tar
          sbom-path: beam_mcp-${{ steps.build.outputs.version }}.cdx.json
      - name: verify the SBOM attestation against the tarball this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "beam_mcp-${{ steps.build.outputs.version }}.tar" --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://cyclonedx.org/bom
      # docs/provenance.md tells a consumer to fetch the SBOM this way; this step is that
      # command, run, and its result compared with the file this run generated.
      - name: the SBOM a consumer downloads is the document this run generated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.build.outputs.version }}"
          mkdir -p fetched && cd fetched
          gh attestation download "../beam_mcp-${v}.tar" --repo "${GITHUB_REPOSITORY}" --predicate-type https://cyclonedx.org/bom
          jq -S . "../beam_mcp-${v}.cdx.json" > generated.json
          found=no
          while IFS= read -r line; do
            printf '%s' "$line" | jq -r '.dsseEnvelope.payload' | base64 -d | jq -S '.predicate' > candidate.json
            if cmp -s candidate.json generated.json; then found=yes; fi
          done < <(cat sha256:*.jsonl)
          [ "$found" = yes ] || { echo "FAIL: no downloaded SBOM attestation carries the document this run generated"; exit 1; }
          echo "the downloaded SBOM predicate equals the generated document"
      - name: verify the attestation against the tarball this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh attestation verify "beam_mcp-${{ steps.build.outputs.version }}.tar" --repo "${GITHUB_REPOSITORY}"
      - name: verify the attestation against the bytes hex.pm serves for this version
        env:
          GH_TOKEN: ${{ github.token }}
          ON_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -uo pipefail
          v="${{ steps.build.outputs.version }}"
          code=$(curl -sSL -o "published-${v}.tar" -w '%{http_code}' "https://repo.hex.pm/tarballs/beam_mcp-${v}.tar") || code="000"
          if [ "${code}" != "200" ]; then
            if [ "${ON_TAG}" = "true" ]; then
              echo "FAIL: hex.pm answered ${code} for beam_mcp ${v} on the tag's run -- publish first, then push the tag (or re-run this workflow once it is published); 404 means not published, anything else means the fetch failed"
              exit 1
            fi
            echo "NOT MEASURED: hex.pm answered ${code} for beam_mcp ${v}; nothing is published from a manual run, and the binding is measured on the tag's run"
            exit 0
          fi
          pub=$(sha256sum "published-${v}.tar" | cut -d' ' -f1)
          echo "published sha256 ${pub}; built ${{ steps.build.outputs.sha256 }}"
          if [ "${pub}" != "${{ steps.build.outputs.sha256 }}" ]; then
            if [ "${ON_TAG}" = "true" ]; then
              echo "FAIL: the published tarball is not the bytes this commit builds canonically -- it was not published with tools/release_tarball.sh, and this attestation does not describe what hex.pm serves"
              exit 1
            fi
            # Off a tag the tree is not the published version's (or the published one was a
            # working-tree build, as every release before this workflow was): nobody's release.
            echo "NOT MEASURED: hex.pm serves ${v} but not this commit's bytes; a manual run attests nobody's release, and the binding is measured on the tag's run"
            exit 0
          fi
          gh attestation verify "published-${v}.tar" --repo "${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-${{ steps.build.outputs.version }}
          path: |
            beam_mcp-${{ steps.build.outputs.version }}.tar
            beam_mcp-${{ steps.build.outputs.version }}.cdx.json
          if-no-files-found: error
